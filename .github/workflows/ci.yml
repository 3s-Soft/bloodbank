name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the previous run; only the latest matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:20-alpine base.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No database or Firebase credentials are provided, and none are needed:
      # the MySQL pool and Firebase Admin both initialise lazily, so a build
      # never touches either. If this step starts failing for a missing
      # variable, something began reaching out at module scope - fix that
      # rather than adding secrets here.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
