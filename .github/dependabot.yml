version: 2

updates:
  # Security advisories only.
  #
  # Enabling routine version updates on this tree produced a wall of pull
  # requests within minutes, which is why the previous configuration was
  # removed in the first place. `open-pull-requests-limit: 0` disables
  # scheduled version bumps while leaving Dependabot's security updates
  # active, so a real CVE still opens a PR and routine bumps do not.
  #
  # To resume routine updates, raise this limit and re-add a `groups` block.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
